<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>ملعب 21 | نمط لعب كرة القدم</title>
<style>
:root{--green:#2f8f38;--green2:#4da944;--hud:#251054;--hud2:#452080;--white:#f8fbff;--cyan:#20e4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071b0a;color:#fff;font-family:Arial,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer}.game{position:relative;width:100%;height:100%;overflow:hidden;background:#348f38}.pitch{position:absolute;inset:0;overflow:hidden;background:repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 10%,rgba(0,0,0,.035) 10% 20%),linear-gradient(#63ba53,#278132);transform:scale(1.08)}.pitch:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.85%,rgba(255,255,255,.8) 49.9% 50.1%,transparent 50.15%),radial-gradient(circle at 50% 50%,transparent 0 8%,rgba(255,255,255,.88) 8.1% 8.35%,transparent 8.5%);opacity:.95}.pitch:after{content:"";position:absolute;left:6%;right:6%;top:7%;bottom:7%;border:3px solid rgba(255,255,255,.9);box-shadow:inset 0 0 0 90px transparent,inset 0 0 0 92px rgba(255,255,255,.02)}.box{position:absolute;top:7%;bottom:7%;width:15%;border:3px solid rgba(255,255,255,.85)}.box.left{left:6%;border-left:0}.box.right{right:6%;border-right:0}.goal{position:absolute;top:31%;bottom:31%;width:2.7%;border:3px solid #eee}.goal.left{left:3.3%;border-left:0}.goal.right{right:3.3%;border-right:0}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.24) 100%);pointer-events:none}.topbar{position:absolute;top:14px;left:7%;right:7%;display:flex;align-items:center;justify-content:space-between;z-index:10}.score{display:flex;align-items:center;gap:18px;min-width:310px;padding:8px 20px;background:linear-gradient(90deg,var(--hud),var(--hud2));border-radius:5px;box-shadow:0 5px 12px #0006;font-weight:800;direction:ltr}.score .team{font-size:18px;min-width:65px;text-align:center}.score .goals{font-size:24px;letter-spacing:8px}.clock{position:absolute;top:-31px;left:50%;transform:translateX(-50%);background:#302064;padding:3px 35px;font-size:18px;border-radius:3px}.pause{width:54px;height:54px;border-radius:8px;background:#ffffffcc;color:#444;font-size:25px;box-shadow:0 3px 10px #0004}.player{position:absolute;width:29px;height:39px;z-index:4;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear}.player .body{position:absolute;left:5px;top:12px;width:19px;height:25px;border-radius:7px 7px 4px 4px;background:#f4f4ed;box-shadow:0 4px 3px #0005}.player .head{position:absolute;left:9px;top:2px;width:12px;height:12px;border-radius:50%;background:#c88f65}.player .shorts{position:absolute;left:5px;top:29px;width:19px;height:9px;background:#eee;border-radius:0 0 4px 4px}.player.red .body,.player.red .shorts{background:#9d1722}.player .name{position:absolute;bottom:43px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;font-weight:700;text-shadow:0 2px 3px #000}.player.active:before{content:"";position:absolute;bottom:-11px;left:50%;width:34px;height:9px;transform:translateX(-50%);border:2px solid var(--cyan);border-radius:50%;box-shadow:0 0 8px var(--cyan)}.player.active:after{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid var(--cyan)}.ball{position:absolute;z-index:8;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 3px 5px #0008;transform:translate(-50%,-50%);transition:left .08s linear,top .08s linear}.minimap{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:180px;height:94px;border:2px solid #ffffff66;background:#277c32aa;z-index:5}.minimap:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #fff8}.mini-dot{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);background:#fff}.mini-dot.red{background:#ec2939}.controls{position:absolute;inset:0;z-index:20;pointer-events:none}.joystick{pointer-events:auto;position:absolute;bottom:65px;left:8%;width:138px;height:138px;border-radius:50%;background:#0003;border:1px solid #fff2;box-shadow:inset 0 0 18px #0004}.stick{position:absolute;left:31px;top:31px;width:76px;height:76px;border-radius:50%;background:#e9e9e9cc;box-shadow:0 4px 10px #0006}.actions{pointer-events:auto;position:absolute;right:7%;bottom:65px;width:260px;height:230px}.action{position:absolute;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#72be68,#237d2b);border:2px solid #ffffff22;box-shadow:inset 0 0 12px #0004,0 4px 9px #0006;font-size:16px}.action:active,.pause:active{transform:scale(.94)}.through{left:0;top:37px}.pass{left:0;bottom:0}.shoot{right:0;top:0}.dash{right:0;bottom:0}.hint{position:absolute;top:87px;left:50%;transform:translateX(-50%);padding:8px 15px;border-radius:18px;background:#0007;font-size:13px;opacity:0;transition:opacity .3s}.hint.show{opacity:1}
@media(max-width:700px){.topbar{left:2%;right:2%;top:9px}.score{min-width:245px;gap:8px;padding:6px 10px}.score .team{font-size:13px}.score .goals{font-size:19px}.clock{font-size:14px;padding:3px 22px;top:-25px}.pause{width:43px;height:43px;font-size:19px}.joystick{left:4%;bottom:34px;width:112px;height:112px}.stick{left:25px;top:25px;width:62px;height:62px}.actions{right:3%;bottom:29px;width:205px;height:190px}.action{width:76px;height:76px;font-size:13px}.minimap{bottom:7px;width:135px;height:70px}.player .name{font-size:10px}}
</style>
</head>
<body>
<main class="game" id="game">
  <section class="pitch"><div class="box left"></div><div class="box right"></div><div class="goal left"></div><div class="goal right"></div></section><div class="shade"></div>
  <header class="topbar"><div class="score"><span class="team">MDC</span><span class="goals" id="score">0 - 0</span><span class="team">LIV</span><span class="clock" id="clock">08:29</span></div><button class="pause" id="pause" aria-label="إيقاف">Ⅱ</button></header>
  <div id="players"></div><div class="ball" id="ball"></div><div class="hint" id="hint">مرّر الكرة أو اضغط تسديد</div>
  <div class="minimap" id="minimap"></div>
  <div class="controls"><div class="joystick" id="joystick"><div class="stick" id="stick"></div></div><div class="actions"><button class="action shoot" data-action="shoot">تسديد</button><button class="action through" data-action="through">بينية</button><button class="action pass" data-action="pass">تمرير</button><button class="action dash" data-action="dash">انطلاق</button></div></div>
</main>
<script>
const $=s=>document.querySelector(s), game=$('#game'), ball=$('#ball'), players=$('#players'), hint=$('#hint');
let state={x:61,y:35,minute:8,second:29,paused:false,score:[0,0],speed:1};
const squad=[['SERGI ROBERTO',61,35,'active'],['M. SALAH',70,38,'red'],['RONALDO',77,62,''],['KABAK',84,25,''],['MIDFIELDER',52,57,''],['DEFENDER',37,72,''],['WINGER',25,28,'red'],['DEFENDER',13,59,'red']];
function pct(v){return v+'%'}
function draw(){players.innerHTML='';const mini=$('#minimap');mini.innerHTML='';squad.forEach((p,i)=>{const el=document.createElement('div');el.className='player '+(p[3]==='red'?'red ':'')+(p[3]==='active'?'active':'');el.style.left=pct(p[1]);el.style.top=pct(p[2]);el.innerHTML='<span class="head"></span><span class="body"></span><span class="shorts"></span>'+(p[0]?'<span class="name">'+p[0]+'</span>':'');players.appendChild(el);const d=document.createElement('i');d.className='mini-dot '+(p[3]==='red'?'red':'');d.style.left=p[1]+'%';d.style.top=p[2]+'%';mini.appendChild(d)});ball.style.left=pct(state.x);ball.style.top=pct(state.y);}
function flash(text){hint.textContent=text;hint.classList.add('show');setTimeout(()=>hint.classList.remove('show'),1200)}
function move(dx,dy){if(state.paused)return;state.x=Math.max(8,Math.min(92,state.x+dx*state.speed));state.y=Math.max(12,Math.min(88,state.y+dy*state.speed));ball.style.left=pct(state.x);ball.style.top=pct(state.y)}
function action(type){if(state.paused)return;if(type==='pass'){move(7,-2);flash('تمريرة دقيقة');}if(type==='through'){move(12,0);flash('بينية للأمام');}if(type==='dash'){state.speed=2;move(4,-1);flash('انطلاق سريع');setTimeout(()=>state.speed=1,700)}if(type==='shoot'){flash('تسديدة قوية!');if(state.x>82||state.x<18){state.score[0]++;$('#score').textContent=state.score.join(' - ');flash('جوووول!');}else move(10,0)}}
document.querySelectorAll('.action').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
$('#pause').addEventListener('click',()=>{state.paused=!state.paused;$('#pause').textContent=state.paused?'▶':'Ⅱ';flash(state.paused?'موقوف مؤقتاً':'استئناف اللعب')});
let dragging=false;const joy=$('#joystick'),stick=$('#stick');function setStick(e){const r=joy.getBoundingClientRect(),x=(e.touches?e.touches[0].clientX:e.clientX)-r.left-r.width/2,y=(e.touches?e.touches[0].clientY:e.clientY)-r.top-r.height/2;const max=38,len=Math.hypot(x,y)||1,scale=Math.min(1,max/len);stick.style.transform=`translate(${x*scale}px,${y*scale}px)`;move(x/max*.9,y/max*.9)}joy.addEventListener('pointerdown',e=>{dragging=true;joy.setPointerCapture(e.pointerId);setStick(e)});joy.addEventListener('pointermove',e=>dragging&&setStick(e));joy.addEventListener('pointerup',()=>{dragging=false;stick.style.transform='';});
setInterval(()=>{if(!state.paused){state.second++;if(state.second>=60){state.second=0;state.minute++}$('#clock').textContent=String(state.minute).padStart(2,'0')+':'+String(state.second).padStart(2,'0')}},1000);draw();
</script>
</body>
</html>
